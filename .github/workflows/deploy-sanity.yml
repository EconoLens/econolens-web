name: Deploy Sanity Studio
on:
  push:
    branches:
      - main
    paths:
      - 'sanity/**'
      - 'sanity.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Sanity Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Show config files
        run: |
          echo "=== sanity.cli.ts ==="
          cat sanity.cli.ts
          echo "=== sanity.config.ts ==="
          cat sanity.config.ts

      - name: Build Sanity Studio
        run: |
          echo "Building studio..."
          ./node_modules/.bin/sanity build 2>&1
          echo "Build exit: $?"
          echo "=== dist/ contents ==="
          ls -la dist/ 2>&1 || echo "NO dist/ directory found"
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Deploy Sanity Studio
        run: |
          echo "Token length: ${#SANITY_AUTH_TOKEN}"
          echo "Deploying..."
          ./node_modules/.bin/sanity deploy --yes 2>&1
          echo "Deploy exit: $?"
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
