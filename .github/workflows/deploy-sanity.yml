name: Deploy Sanity Studio
on:
  push:
    branches:
      - main
    paths:
      - 'sanity/**'
      - 'sanity.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Sanity Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Deploy Sanity Studio
        run: |
          echo "Token length: ${#SANITY_AUTH_TOKEN}" > /tmp/deploy.log
          echo "Sanity version:" >> /tmp/deploy.log
          ./node_modules/.bin/sanity --version >> /tmp/deploy.log 2>&1
          echo "Running deploy:" >> /tmp/deploy.log
          ./node_modules/.bin/sanity deploy --yes >> /tmp/deploy.log 2>&1
          echo "Exit: $?" >> /tmp/deploy.log
          cat /tmp/deploy.log
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Upload deploy log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-log
          path: /tmp/deploy.log
