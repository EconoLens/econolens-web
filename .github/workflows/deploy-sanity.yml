name: Deploy Sanity Studio
on:
  push:
    branches:
      - main
    paths:
      - 'sanity/**'
      - 'sanity.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Sanity Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Show config files
        run: |
          echo "=== sanity.cli.ts ==="
          cat sanity.cli.ts
          echo "=== sanity.config.ts ==="
          cat sanity.config.ts
          echo "=== package.json sanity version ==="
          node -e "const p = require('./package.json'); console.log('sanity:', p.dependencies.sanity)"

      - name: Deploy Sanity Studio
        run: |
          echo "Token length: ${#SANITY_AUTH_TOKEN}"
          echo "=== Starting deploy ==="
          yes | ./node_modules/.bin/sanity deploy 2>&1 | tee /tmp/deploy.log
          DEPLOY_EXIT=${PIPESTATUS[0]}
          echo "=== Deploy exit: $DEPLOY_EXIT ==="
          echo "=== Full deploy log ==="
          cat /tmp/deploy.log
          exit $DEPLOY_EXIT
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
          CI: "true"
          FORCE_COLOR: "0"
          NO_COLOR: "1"

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: /tmp/deploy.log
          retention-days: 3
