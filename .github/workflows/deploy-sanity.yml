name: Deploy Sanity Studio
on:
  push:
    branches:
      - main
    paths:
      - 'sanity/**'
      - 'sanity.config.ts'
      - 'package.json'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Sanity Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Debug - Check environment
        run: |
          echo "=== Sanity CLI version ==="
          ./node_modules/.bin/sanity --version
          echo "=== Token present ==="
          echo "Token length: ${#SANITY_AUTH_TOKEN}"
          echo "=== sanity.config.ts exists ==="
          ls -la sanity.config.ts sanity.cli.ts
          echo "=== sanity.cli.ts content ==="
          cat sanity.cli.ts
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Deploy Sanity Studio
        run: |
          echo "=== Running sanity deploy ==="
          ./node_modules/.bin/sanity deploy --yes 2>&1
          echo "=== Exit code: $? ==="
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
